name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Core on Linux
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  apple:
    name: Package and demo on Apple platforms
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Check Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27' || { echo "::error::Expected Xcode 27"; exit 1; }
      - name: Test package on macOS
        run: xcodebuild test -scheme ChekReader-Package -destination 'platform=macOS'
      - name: Build package for iOS Simulator
        run: xcodebuild build -scheme ChekReader-Package -destination 'generic/platform=iOS Simulator'
      - name: Build demo app for macOS
        run: >
          xcodebuild build -project Examples/ChekReaderDemo/ChekReaderDemo.xcodeproj
          -scheme ChekReaderDemo -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO
      - name: Build demo app for iOS Simulator
        run: >
          xcodebuild build -project Examples/ChekReaderDemo/ChekReaderDemo.xcodeproj
          -scheme ChekReaderDemo -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

  script:
    name: Reader script
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Scripts/Reader
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Scripts/Reader/package-lock.json
      - name: Install
        run: npm ci
      - name: Check the committed script matches its source
        run: |
          npm run build
          git diff --exit-code -- ../../Sources/ChekReaderNavigator/Resources \
            || { echo "::error::reader.js is out of date. Run npm run build in Scripts/Reader and commit it."; exit 1; }
      - name: Install browsers
        run: npx playwright install --with-deps webkit chromium
      - name: Test in WebKit
        run: npm test
        env:
          READER_BROWSER: webkit
      - name: Test in Chromium
        run: node --test test/*.test.mjs
        env:
          READER_BROWSER: chromium
