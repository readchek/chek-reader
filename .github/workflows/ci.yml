name: CI

# Pushes to other branches are covered by their pull request, so running on
# both would build every commit twice.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs run on the maintainers' own machines when the SELF_HOSTED_LINUX or
# SELF_HOSTED_MAC repository variable is "true", and on GitHub's runners
# otherwise. Pull requests from forks always use GitHub's runners, so code
# from outside the repository never runs on our machines. See
# .github/RUNNERS.md.
jobs:
  linux:
    name: Core on Linux
    runs-on: ${{ vars.SELF_HOSTED_LINUX == 'true' && github.event.pull_request.head.repo.fork != true && fromJSON('["self-hosted","chek-linux"]') || 'ubuntu-latest' }}
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  apple:
    name: Package and demo on Apple platforms
    runs-on: ${{ vars.SELF_HOSTED_MAC == 'true' && github.event.pull_request.head.repo.fork != true && fromJSON('["self-hosted","chek-mac"]') || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v7
      # Use Xcode 27 wherever it's installed, since the machine's selected
      # developer directory can be the Command Line Tools, which have no
      # xcodebuild.
      - name: Select Xcode 27
        run: |
          if xcodebuild -version 2>/dev/null | grep -q '^Xcode 27'; then
            xcodebuild -version
            exit 0
          fi
          for app in /Applications/Xcode*.app; do
            if "$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | grep -q '^Xcode 27'; then
              echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
              "$app/Contents/Developer/usr/bin/xcodebuild" -version
              exit 0
            fi
          done
          echo "::error::Xcode 27 isn't installed in /Applications"
          exit 1
      - name: Test package on macOS
        run: xcodebuild test -scheme ChekReader-Package -destination 'platform=macOS'
      - name: Build package for iOS Simulator
        run: xcodebuild build -scheme ChekReader-Package -destination 'generic/platform=iOS Simulator'
      - name: Build demo app for macOS
        run: >
          xcodebuild build -project Examples/ChekReaderDemo/ChekReaderDemo.xcodeproj
          -scheme ChekReaderDemo -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO
      - name: Build demo app for iOS Simulator
        run: >
          xcodebuild build -project Examples/ChekReaderDemo/ChekReaderDemo.xcodeproj
          -scheme ChekReaderDemo -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
