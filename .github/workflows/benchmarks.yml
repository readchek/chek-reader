name: Benchmarks

# Runs the reader comparison in the iOS Simulator. It isn't a required
# check: simulator timings vary between runner machines, so results are for
# comparing readers within one fixture and for spotting regressions.
#
# One job builds the app. Then each fixture runs in its own job on its own
# machine, so the jobs run in parallel without competing for one machine's
# processor, which would skew the timings. On our own Mac (SELF_HOSTED_MAC,
# see .github/RUNNERS.md) its one runner takes the fixtures one after another
# for the same reason. A last job merges the results into one summary.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Repetitions per fixture and reader
        default: "5"
      device:
        description: Simulator name, such as iPhone 17 Pro (default is the first iPhone on the newest runtime)
        default: ""
  push:
    paths:
      - "Benchmarks/**"
      - "!Benchmarks/Results/**"
      - "!Benchmarks/README.md"
      - ".github/workflows/benchmarks.yml"

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: List fixtures
    # Stays on GitHub's runners: it runs on the host rather than in a
    # container, and our Linux runner only takes container jobs (see
    # .github/RUNNERS.md).
    runs-on: ubuntu-latest
    outputs:
      fixtures: ${{ steps.list.outputs.fixtures }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "fixtures=$(jq -c '[.fixtures[].id]' Benchmarks/corpus.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    runs-on: ${{ vars.SELF_HOSTED_MAC == 'true' && github.event.pull_request.head.repo.fork != true && fromJSON('["self-hosted","chek-mac"]') || 'xcode-27' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore build
        uses: actions/cache@v6
        with:
          path: Benchmarks/.build
          key: build-${{ hashFiles('Benchmarks/ReaderBench/project.yml', 'Benchmarks/ReaderBench/Sources/**') }}
          restore-keys: build-
      - name: Build the app
        run: swift Benchmarks/Scripts/run.swift --build-only
      # Compiling corpus.swift takes minutes on a fresh machine, so compile
      # it once here instead of on every fixture's machine.
      - name: Compile the corpus tool
        run: swiftc -O Benchmarks/Scripts/corpus.swift -o Benchmarks/Scripts/corpus-tool
      # A tarball keeps the app's symlinks and permissions, which artifacts drop.
      - name: Package
        run: tar -czf bench-tools.tgz -C Benchmarks/.build/Build/Products/Release-iphonesimulator ReaderBench.app -C "$PWD/Benchmarks/Scripts" corpus-tool
      - uses: actions/upload-artifact@v7
        with:
          name: bench-tools
          path: bench-tools.tgz
          retention-days: 1

  fixture:
    name: ${{ matrix.fixture }}
    needs: [plan, build]
    runs-on: ${{ vars.SELF_HOSTED_MAC == 'true' && github.event.pull_request.head.repo.fork != true && fromJSON('["self-hosted","chek-mac"]') || 'xcode-27' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fixture: ${{ fromJSON(needs.plan.outputs.fixtures) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bench-tools
      - name: Unpack
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          tar -xzf bench-tools.tgz -C "$RUNNER_TEMP/bench"
      - name: Restore corpus
        uses: actions/cache@v6
        with:
          path: Benchmarks/.corpus
          key: corpus-${{ matrix.fixture }}-${{ hashFiles('Benchmarks/corpus.json', 'Benchmarks/Scripts/corpus.swift') }}
      - name: Run benchmarks
        env:
          RUNS: ${{ inputs.runs || '5' }}
          DEVICE: ${{ inputs.device }}
          FIXTURE: ${{ matrix.fixture }}
        run: |
          # The corpus tool finds corpus.json next to itself, so it runs from Scripts.
          cp "$RUNNER_TEMP/bench/corpus-tool" Benchmarks/Scripts/corpus-tool
          args=(--runs "$RUNS" --only "$FIXTURE" --out Benchmarks/Results/ci)
          args+=(--app "$RUNNER_TEMP/bench/ReaderBench.app" --corpus-tool "$PWD/Benchmarks/Scripts/corpus-tool")
          if [ -n "$DEVICE" ]; then args+=(--device "$DEVICE"); fi
          swift Benchmarks/Scripts/run.swift "${args[@]}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.fixture }}
          path: Benchmarks/Results/ci
          if-no-files-found: ignore

  summary:
    name: Summary
    needs: fixture
    # Summarize whatever fixtures finished, but not a run that a newer push
    # cancelled, which has nothing to merge.
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.SELF_HOSTED_LINUX == 'true' && github.event.pull_request.head.repo.fork != true && fromJSON('["self-hosted","chek-linux"]') || 'ubuntu-latest' }}
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
      - name: Merge and summarize
        # The Swift image's default shell is sh, which has no arrays.
        shell: bash
        run: |
          shopt -s nullglob
          files=(results/*/results.json)
          if [ ${#files[@]} -eq 0 ]; then echo "No results to summarize"; exit 1; fi
          swift Benchmarks/Scripts/summarize.swift --out summary.md --merged results.json "${files[@]}"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          # Also in the log, which stays readable where artifact downloads aren't.
          cat summary.md
          echo "--- results.json ---"
          cat results.json
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            summary.md
            results.json
