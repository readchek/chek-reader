name: Reader script

# Only for changes to the script, and not on drafts: it installs two
# browsers, so running it on every push costs more than it catches.
on:
  push:
    branches: [main]
    paths:
      - Scripts/Reader/**
      - Sources/ChekReaderNavigator/Resources/reader.js
      - .github/workflows/reader-script.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Scripts/Reader/**
      - Sources/ChekReaderNavigator/Resources/reader.js
      - .github/workflows/reader-script.yml

concurrency:
  group: reader-script-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script:
    name: Reader script
    if: github.event_name == 'push' || !github.event.pull_request.draft
    # Stays on GitHub's runners: installing the browsers' system packages
    # needs root on the host, which our own Linux runner doesn't give jobs.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Scripts/Reader
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Scripts/Reader/package-lock.json
      - name: Install
        run: npm ci
      - name: Check the committed script matches its source
        run: |
          npm run build
          git diff --exit-code -- ../../Sources/ChekReaderNavigator/Resources \
            || { echo "::error::reader.js is out of date. Run npm run build in Scripts/Reader and commit it."; exit 1; }
      - name: Install browsers
        run: npx playwright install --with-deps webkit chromium
      - name: Test in WebKit
        run: npm test
        env:
          READER_BROWSER: webkit
      - name: Test in Chromium
        run: node --test test/*.test.mjs
        env:
          READER_BROWSER: chromium
